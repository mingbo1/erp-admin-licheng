{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        
                        <div class="layui-input-inline">
                            <input type="text" name="purchase_time" id="purchase_time" autocomplete="off" placeholder="{:__('Purchase_time')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="purchase_type" id="purchase_type" class="layui-input" lay-filter="customerType">
                                <option value="1" selected>{:__('按客户')}</option>
                                <option value="2">{:__('按商品')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline search_type search_type1">
                            <select name="customerType" id="customerType" class="layui-input">
                                <option value="">请选择客户类别</option>
                                {foreach name="customerType" item="vo"}
                                <option value="{$vo.id}">{$vo.type_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline search_type search_type1">
                            <select name="customerList" id="customerList" class="layui-input">
                                <option value="">请选择客户</option>
                                {foreach name="customerList" item="vo"}
                                <option value="{$vo.id}">{$vo.customer_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline search_type search_type2">
                            <select name="goodsType" id="goodsType" class="layui-input">
                                <option value="">请选择商品类别</option>
                                {foreach name="goodsType" item="vo"}
                                <option value="{$vo.id}">{$vo.supplier_type_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline search_type search_type2">
                            <select name="goods_code" id="goods_code" class="layui-input">
                                <option value="">请选择商品</option>
                                {foreach name="goodsList" item="vo"}
                                <option value="{$vo.goods_code}">{$vo.goods_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm btn-refresh" type="button" id="search" data-type="reload">
                                 <i class="layui-icon"></i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <div class="layui-tab">
                        <ul class="layui-tab-title" style="display: none">
                            <li class="layui-this clicks1"></li>
                            <li class="clicks2"></li>
                        </ul>
                        <div class="layui-tab-content">
                            <div class="layui-tab-item layui-tab-item1 layui-show">
                                <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                                       width="100%" lay-filter="table">
                                </table>
                            </div>
                            <div class="layui-tab-item layui-tab-item2">
                                <table id="table2" class="table table-striped table-bordered table-hover table-nowrap"
                                       width="100%" lay-filter="table2">
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
