{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>

                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        
                        <div class="layui-input-inline">
                            <input type="text" name="goods_name" id="goods_name" autocomplete="off" placeholder="{:__('商品名称')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="batch_name" id="batch_name" autocomplete="off" placeholder="{:__('批次')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="purchase_code" id="purchase_code" autocomplete="off" placeholder="{:__('Purchase_code')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="purchase_time" id="purchase_time" autocomplete="off" placeholder="{:__('Purchase_time')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="business_type" id="business_type" placeholder="{:__('Business_type')}" class="layui-input">
                                <option value="">请选择{:__('Business_type')}</option>
                                <option value="1">{:__('Business_type 1')}</option>
                                <option value="2">{:__('Business_type 2')}</option>
                                <option value="3">{:__('Business_type 3')}</option>
                                <option value="4">{:__('Business_type 4')}</option>
                                <option value="5">{:__('Business_type 5')}</option>
                                <option value="6">{:__('Business_type 6')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="sale_id" id="sale_id" placeholder="{:__('Sale_id')}" class="layui-input">
                                <option value="">请选择{:__('Sale_id')}</option>
                                {foreach name="saleList" item="vo"}
                                <option value="{$vo.id}">{$vo.men_code} {$vo.name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm btn-refresh" type="button" id="search" data-type="reload">
                                 <i class="layui-icon"></i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%" lay-filter="table">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
