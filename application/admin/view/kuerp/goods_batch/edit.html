{include file="kuerp/common/menu" /}
<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Goods_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-goods_id" data-rule="required" data-source="goods/index" class="form-control selectpage" name="row[goods_id]" type="text" value="{$row.goods_id|htmlentities}" placeholder="{:__('Goods_id')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Goods_code')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-goods_code" class="form-control" name="row[goods_code]" type="text" value="{$row.goods_code|htmlentities}" placeholder="{:__('Goods_code')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Attribute_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-attribute_id" data-rule="required" data-source="attribute/index" class="form-control selectpage" name="row[attribute_id]" type="text" value="{$row.attribute_id|htmlentities}" placeholder="{:__('Attribute_id')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Stores_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-stores_id" data-rule="required" data-source="stores/index" class="form-control selectpage" name="row[stores_id]" type="text" value="{$row.stores_id|htmlentities}" placeholder="{:__('Stores_id')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Batch_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-batch_name" class="form-control" name="row[batch_name]" type="text" value="{$row.batch_name|htmlentities}" placeholder="{:__('Batch_name')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Manufacture')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-manufacture" class="form-control" name="row[manufacture]" type="number" value="{$row.manufacture|htmlentities}" placeholder="{:__('Manufacture')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Guarantee')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-guarantee" class="form-control" name="row[guarantee]" type="number" value="{$row.guarantee|htmlentities}" placeholder="{:__('Guarantee')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Validity')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-validity" class="form-control" name="row[validity]" type="number" value="{$row.validity|htmlentities}" placeholder="{:__('Validity')}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
