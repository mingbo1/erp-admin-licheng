{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan btn-refresh" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                        </div>
                    </script>

                    <div class="" style="margin-bottom: 20px;">
                        <button class="layui-btn layui-icon-btn layui-btn-sm" type="button" id="checkout">
                            <i class="layui-icon">&#xe683;</i>结账
                        </button>
                        <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan" type="button" id="checkoutf">
                            <i class="layui-icon">&#xe673;</i>反结账
                        </button>
                        <span>
                             结账日期不能小于系统启用日期：{$enable_time}，不能小于等于上次结账日期：{$checkdate} ！结账日期之前的数据只能查询，不能修改。
                        </span>
                    </div>
                    <form class="layui-form">
                        <div class="layui-input-inline">
                            <input type="text" name="checkdate" id="checkdate" value="" autocomplete="off" placeholder="{:__('结账日期')}" class="layui-input">
                        </div>
                    </form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%" lay-filter="table">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
