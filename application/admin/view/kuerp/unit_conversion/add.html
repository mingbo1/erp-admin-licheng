{include file="kuerp/common/menu" /}
<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="table_box">
        <table id="unit_table">
            <tr>
                <td class="text_right"><div class="">基本单位</div></td>
                <td><div><input data-rule="required" type="text" name="row[basic_unit]" class="basic_unit" value=""></div>
                </td>
                <td colspan="3" class="notice">基本单位应为最小度量单位</td>
            </tr>
            <tr>
                <td class="text_right">
                    <div class="">
                        <span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span>
                        <span class="unit_name">副单位1</span>
                    </div>
                </td>
                <td><div><input data-rule="required" type="text" name="row[sub_unit][]" class="goods_note" value=""></div>
                <td>=</td>
                <td>
                    <input data-rule="required" type="number" name="row[advance_rate][]" class="advance_rate" value="">
                </td>
                <td class="basic_unit_td"></td>
            </tr>
        </table>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
