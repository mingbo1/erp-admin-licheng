{include file="kuerp/common/menu" /}
<form id="pay-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action=""
      data-apply-id="{$row.id}">
    <div class="panel panel-default">
        <div class="panel-heading"><b>确认打款</b> <span style="color:#999;">（{$row.apply_code}）</span></div>
        <div class="panel-body">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-3">供应商:</label>
                <div class="col-xs-12 col-sm-8">
                    <p class="form-control-static">{$row.supplyer_code|htmlentities} {$row.supplyer_name|htmlentities}</p>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-3">付款金额:</label>
                <div class="col-xs-12 col-sm-8">
                    <p class="form-control-static" style="color:#ff5722;font-weight:bold;">￥{:number_format($row['total_money'], 2, '.', '')}</p>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-3"><span class="must">*</span> 付款账户:</label>
                <div class="col-xs-12 col-sm-8">
                    <select id="c-accounts_id" name="accounts_id" class="form-control selectpicker" data-rule="required">
                        <option value="">请选择付款账户</option>
                        {foreach name="accounts" item="vo"}
                        <option value="{$vo.id}">{$vo.account_coding} {$vo.account_name}（余额 ￥{$vo.balance}）</option>
                        {/foreach}
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-3"><span class="must">*</span> 付款日期:</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="date" id="c-pay_date" name="pay_date" class="form-control" value="{:date('Y-m-d')}" data-rule="required">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-3">银行流水号:</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="text" name="pay_number" class="form-control" placeholder="银行流水号/回单号">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-3">付款说明:</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="text" name="remark" class="form-control" placeholder="付款说明（选填）">
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-3">付款回单:</label>
                <div class="col-xs-12 col-sm-8">
                    <input type="file" id="voucher_file" accept="image/*,.pdf,.ofd,.zip,.rar,.xlsx,.xls,.doc,.docx">
                    <input type="hidden" name="enclosure_id" id="voucher_enclosure_id" value="">
                    <div id="voucher-tip" style="color:#999;font-size:12px;margin-top:4px;">支持图片、PDF、OFD 等（选填）</div>
                </div>
            </div>
            <div class="alert alert-warning" style="margin-bottom:0;">
                确认后系统会自动生成付款单并审核入账：扣减所选账户余额、减少供应商应付款、核销关联采购单。
            </div>
        </div>
    </div>
    <div class="form-group layer-footer" style="text-align:center;">
        <button type="submit" class="btn btn-success btn-embossed">确认打款</button>
        <button type="button" class="btn btn-default btn-embossed layer-close">取消</button>
    </div>
</form>
