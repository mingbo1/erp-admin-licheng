{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                            <button class="layui-btn layui-btn-sm layui-bg-cyan btn-refresh" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                            <button class="layui-btn layui-btn-sm layui-bg-blue" lay-event="export">导出选中</button>
                            {if condition="$auth->check('kuerp/sales_recon/items')==1"}
                            <button class="layui-btn layui-btn-sm layui-bg-green" lay-event="gotoitems"><i class="layui-icon">&#xe654;</i> 生成对账单</button>
                            {/if}
                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        <div class="layui-input-inline">
                            <input type="text" name="recon_code" id="recon_code" autocomplete="off" placeholder="对账单号" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="customers_id" id="customers_id" class="layui-input">
                                <option value="">请选择客户</option>
                                {foreach name="customers" item="vo"}
                                <option value="{$vo.id}">{$vo.customer_code} {$vo.customer_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="recon_status" id="recon_status" class="layui-input">
                                <option value="">对账状态</option>
                                <option value="0">待对账</option>
                                <option value="1">待二审</option>
                                <option value="2">已对账</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="invoice_status" id="invoice_status" class="layui-input">
                                <option value="">开票状态</option>
                                <option value="0">未开票</option>
                                <option value="1">部分开票</option>
                                <option value="2">已开票</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="pay_status" id="pay_status" class="layui-input">
                                <option value="">收款状态</option>
                                <option value="0">未收款</option>
                                <option value="1">部分收款</option>
                                <option value="2">已收款</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="term_state" id="term_state" class="layui-input">
                                <option value="">到期状态</option>
                                <option value="1">即将到期（{$remindDays}天内）</option>
                                <option value="2">已逾期</option>
                                <option value="3">已收款</option>
                            </select>
                        </div>
                        <div class="layui-input-inline" style="width: 90px">
                            <button class="layui-btn layui-btn-sm" type="button" id="search" data-type="reload">
                                <i class="layui-icon"></i> {:__('Search')}
                            </button>
                        </div>
                    </form>

                    <div id="term-reminder" style="display:none;margin-bottom:10px;"></div>

                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%" lay-filter="table">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 行操作模板：ID 必须区别于 menu.html 全局默认的 #barDemo -->
<script type="text/html" id="barDemoRecon">
    <a class="layui-btn layui-btn-xs layui-bg-blue" lay-event="detail">详情</a>
    <a class="layui-btn layui-btn-xs" lay-event="print">打印</a>
    <a class="layui-btn layui-btn-xs layui-bg-cyan" lay-event="exportone">导出</a>
    {{# if(d.recon_status == '0'){ }}
    <a class="layui-btn layui-btn-xs layui-btn-warm {if condition="$auth->check($nowmenu.'/edit')!=1"}hiddens{/if}" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-bg-green {if condition="$auth->check($nowmenu.'/confirm')!=1"}hiddens{/if}" lay-event="confirm">一审</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger {if condition="$auth->check($nowmenu.'/del')!=1"}hiddens{/if}" lay-event="del">删除</a>
    {{# } }}
    {{# if(d.recon_status == '1'){ }}
    <a class="layui-btn layui-btn-xs layui-bg-green {if condition="$auth->check($nowmenu.'/secondconfirm')!=1"}hiddens{/if}" lay-event="secondconfirm">二审通过</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger {if condition="$auth->check($nowmenu.'/reject')!=1"}hiddens{/if}" lay-event="reject">驳回</a>
    {{# } }}
    {{# if(d.recon_status != '0' && d.invoice_status == '0' && d.pay_status == '0'){ }}
    <a class="layui-btn layui-btn-xs layui-btn-warm {if condition="$auth->check($nowmenu.'/cancelconfirm')!=1"}hiddens{/if}" lay-event="cancelconfirm">撤销对账</a>
    {{# } }}
    {{# if(d.recon_status == '2' && d.invoice_status != '2' && (d.total_amount + d.diff_money) > 0){ }}
    <a class="layui-btn layui-btn-xs layui-bg-orange {if condition="$auth->check($nowmenu.'/invoice')!=1"}hiddens{/if}" lay-event="invoice">开票</a>
    {{# } }}
    {{# if(d.recon_status != '2'){ }}
    <a class="layui-btn layui-btn-xs layui-btn-primary {if condition="$auth->check($nowmenu.'/diff')!=1"}hiddens{/if}" lay-event="diff">差异金额</a>
    {{# } }}
    {{# if(d.recon_status == '2' && d.pay_status != '2' && (d.total_amount + d.diff_money) > 0){ }}
    <a class="layui-btn layui-btn-xs layui-bg-green" lay-event="collect">去收款</a>
    {{# } }}
</script>
