<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="layui-tab">
        <ul class="layui-tab-title">
            <li class="layui-this">基本录入序列号</li>
            <li>批量录入序列号</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
            </div>
            <div class="layui-tab-item more_period row">
                <div class="col-xs-6 col-sm-3 col-md-3 col-lg-3">
                    <div class="form-group">
                        <label class="control-label col-xs-12 col-sm-3">前缀:</label>
                        <div class="col-xs-12 col-sm-9">
                            <input id="c-prefix" class="form-control" type="text" name="prefix" value="" placeholder="前缀，可以为空">
                        </div>
                    </div>
                </div>
                <div class="col-xs-6 col-sm-3 col-md-3 col-lg-3">
                    <div class="form-group">
                        <label class="control-label col-xs-12 col-sm-3">起始号:</label>
                        <div class="col-xs-12 col-sm-9">
                            <input id="c-start" class="form-control" name="start" type="text" value="001" placeholder="起始号">
                        </div>
                    </div>
                </div>
                <div class="col-xs-6 col-sm-3 col-md-3 col-lg-3">
                    <div class="form-group">
                        <label class="control-label col-xs-12 col-sm-3">递增量:</label>
                        <div class="col-xs-12 col-sm-9">
                            <input id="c-incremental" class="form-control" name="incremental" type="number" value="1" placeholder="递增量">
                        </div>
                    </div>
                </div>
                <div class="col-xs-6 col-sm-2 col-md-2 col-lg-2">
                    <div class="form-group">
                        <label class="control-label col-xs-12 col-sm-3">个数:</label>
                        <div class="col-xs-12 col-sm-9">
                            <input id="c-number" class="form-control" name="number" type="number" value="1" placeholder="个数">
                        </div>
                    </div>
                </div>
                <div class="col-xs-6 col-sm-1 col-md-1 col-lg-1">
                    <div class="form-group" style="padding-top: 5px;">
                        <a class="ui-btn ui-btn-sp" id="addAuto">添加</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
