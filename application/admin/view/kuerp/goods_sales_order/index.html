{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan btn-refresh" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm {if condition="$auth->check($nowmenu.'/add')!=1"}hiddens{/if}" lay-event="add"><i class="layui-icon">&#xe654;</i> {:__('Add')}</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-btn-danger {if condition="$auth->check($nowmenu.'/del')!=1"}hiddens{/if}" lay-event="delAll"><i class="layui-icon">&#xe640;</i> {:__('Delete')}</button>

                            {if condition="isset($set['examine']['is_checked']) && $set['examine']['is_checked']==1"}
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-btn-danger fright {if condition="$auth->check($nowmenu.'/examine')!=1"}hiddens{/if}" lay-event="examine_f"><i class="layui-icon">&#xe674;</i> 反审核</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm fright {if condition="$auth->check($nowmenu.'/examine')!=1"}hiddens{/if}" lay-event="examine"><i class="layui-icon">&#xe674;</i> 审核</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-orange fright {if condition="$auth->check($nowmenu.'/secondExamine')!=1"}hiddens{/if}" lay-event="secondExamine"><i class="layui-icon">&#xe674;</i> 二次审核</button>
                            {/if}

                            <input type="hidden" id="createpurchase" value="">
                            <button type="button" class="layui-btn layui-icon-btn layui-btn-sm layui-btn-danger fright createpurchase" data-purid="" data-id="" style="display: none">生成销货单</button>
                            <button type="button" class="layui-btn layui-icon-btn layui-btn-sm layui-btn-danger fright createexchange" data-purid="" data-id="" style="display: none">生成退货单</button>
                        </div>
                    </script>

                    <script type="text/html" id="barDemoSales">
                        {{# if(d.examine_status == 1 && d.purchase_type == 1 && d.status != 0 && d.status != 3 && d.status != 4){ }}
                        <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="ship">发货</a>
                        {{# } }}
                        {{# if(d.examine_status == 1 && d.purchase_type == 1 && d.status != 0 && d.status != 3 && d.status != 4){ }}
                        <a class="layui-btn layui-btn-xs layui-bg-orange" lay-event="confirmreceipt">确认收货</a>
                        {{# } }}
                        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
                        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        
                        <div class="layui-input-inline">
                            <input type="text" name="purchase_code" id="purchase_code" autocomplete="off" placeholder="{:__('Purchase_code')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="purchase_time" id="purchase_time" autocomplete="off" placeholder="{:__('Purchase_time')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="status" id="status" placeholder="{:__('Status')}" class="layui-input">
                                <option value="">请选择{:__('Status')}</option>
                                <option value="0">{:__('Status 0')}</option>
                                <option value="1">{:__('Status 1')}</option>
                                <option value="2">{:__('Status 2')}</option>
                                <option value="3">{:__('Status 3')}</option>
                                <option value="4">{:__('Status 4')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="examine_status" id="examine_status" placeholder="{:__('Examine_status')}" class="layui-input">
                                <option value="">请选择{:__('Examine_status')}</option>
                                <option value="0">{:__('Examine_status 0')}</option>
                                <option value="1">{:__('Examine_status 1')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="second_examine_status" id="second_examine_status" placeholder="{:__('Second_examine_status')}" class="layui-input">
                                <option value="">请选择{:__('Second_examine_status')}</option>
                                <option value="0">{:__('Second_examine_status 0')}</option>
                                <option value="1">{:__('Second_examine_status 1')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="source" id="source" placeholder="{:__('Source')}" class="layui-input">
                                <option value="">请选择{:__('Source')}</option>
                                <option value="admin">{:__('Source admin')}</option>
                                <option value="miniapp">{:__('Source miniapp')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="sale_user" id="sale_user" placeholder="{:__('Sale_user')}" class="layui-input">
                                <option value="">请选择{:__('Sale_user')}</option>
                                {foreach name="saleList" item="vo"}
                                <option value="{$vo.id}">{$vo.name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm" type="button" id="search" data-type="reload">
                                 <i class="layui-icon"></i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%" lay-filter="table">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
