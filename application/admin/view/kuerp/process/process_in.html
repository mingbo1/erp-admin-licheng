{include file="kuerp/common/menu" /}
<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <input type="hidden" id="process_id" name="process_id" value="">
    <input type="hidden" id="old_process_code" value="">

    <div class="panel panel-default">
        <div class="panel-heading">
            <b>外协入库</b>
        </div>
        <div class="panel-body">
            <!-- 加工单基本信息 -->
            <div class="row">
                <div class="col-xs-12 col-sm-4">
                    <div class="form-group">
                        <label class="control-label col-xs-4">加工单号:</label>
                        <div class="col-xs-8">
                            <p class="form-control-static" id="show_process_code">-</p>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-4">
                    <div class="form-group">
                        <label class="control-label col-xs-4">加工商:</label>
                        <div class="col-xs-8">
                            <p class="form-control-static" id="show_supplier">-</p>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-4">
                    <div class="form-group">
                        <label class="control-label col-xs-4">单据日期:</label>
                        <div class="col-xs-8">
                            <p class="form-control-static" id="show_time">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 已出库原材料 -->
            <div class="row">
                <div class="col-xs-12">
                    <div class="form-group">
                        <label class="control-label"><b>已出库原材料:</b></label>
                        <div id="out_material_list" style="padding:5px;background:#f5f5f5;border-radius:3px;"></div>
                    </div>
                </div>
            </div>

            <hr>

            <!-- 入库成品 -->
            <div class="row">
                <div class="col-xs-12">
                    <div class="form-group">
                        <label class="control-label" style="font-weight: bold;">本次入库成品 (按行独立入库, 输入0跳过该行):</label>
                    </div>
                </div>
            </div>
            <div class="list" style="overflow-x: auto">
                <table id="in_product_table">
                    <tr>
                        <th>成品编号</th>
                        <th>名称</th>
                        <th>入库仓库</th>
                        <th>计划数</th>
                        <th>已入库</th>
                        <th>本次入库</th>
                        <th>单位成本</th>
                        <th>成本金额</th>
                        <th class="goods_batch_sd">批次</th>
                        <th class="goods_batch_sd">生产日期</th>
                        <th class="goods_batch_sd">保质期(天)</th>
                        <th class="goods_batch_sd">有效期至</th>
                    </tr>
                </table>
            </div>

            <hr>

            <!-- 加工费 -->
            <div class="row">
                <div class="col-xs-12 col-sm-3">
                    <div class="form-group">
                        <label class="control-label col-xs-5">{:__('Process_fee')}:</label>
                        <div class="col-xs-7">
                            <input type="number" id="total_process_fee" name="total_process_fee" class="form-control price_decimal" value="0" placeholder="加工费合计">
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-3">
                    <div class="form-group">
                        <label class="control-label col-xs-5">{:__('Account_id')}:</label>
                        <div class="col-xs-7">
                            <select name="account_id" id="account_id" class="form-control">
                                <option value="">请选择</option>
                                {foreach name="accountsList" item="vo"}
                                <option value="{$vo.id}">{$vo.account_name}</option>
                                {/foreach}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-3">
                    <div class="form-group">
                        <label class="control-label col-xs-5">{:__('Expend_type_id')}:</label>
                        <div class="col-xs-7">
                            <select name="expend_type_id" id="expend_type_id" class="form-control">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-3">
                    <div class="form-group">
                        <label class="control-label col-xs-5">{:__('Fee_time')}:</label>
                        <div class="col-xs-7">
                            <input id="c-fee_time" class="form-control" data-use-current="true" name="fee_time" type="text" value="{:date('Y-m-d')}" placeholder="{:__('Fee_time')}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-xs-12 col-sm-6">
                    <div class="form-group">
                        <label class="control-label col-xs-2">{:__('Remark')}:</label>
                        <div class="col-xs-10">
                            <input type="text" name="remark" class="form-control" placeholder="备注">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row" style="margin-top: 15px">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2"></label>
                <div class="col-xs-12 col-sm-8">
                    <button type="submit" class="btn btn-success btn-embossed"><i class="fa fa-check"></i> 确认入库</button>
                    <button type="button" class="btn btn-default btn-embossed" onclick="parent.Layer.closeAll();"><i class="fa fa-close"></i> 取消</button>
                </div>
            </div>
        </div>
    </div>
</form>
