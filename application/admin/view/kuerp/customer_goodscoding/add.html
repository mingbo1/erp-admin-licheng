{include file="kuerp/common/menu" /}
<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="row">
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-2">{:__('Customers_id')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-customers_id" data-rule="required" data-source="kuerp/customers/index" data-field="customer_name" class="form-control selectpage" name="row[customers_id]" type="text" value="" placeholder="{:__('Customers_id')}">
                </div>
            </div>
        </div>
    </div>

    <div class="list">
        <table id="purchase_table">
            <tr>
                <th></th>
                <th>
                    <span class="must">*</span>
                    商品
                    <span class="smq_switch" style="display: none;">
                            <span>--扫码枪录入</span>
                            <span>
                                <input  id="c-switch" name="row[switch]" type="hidden" value="0">
                                <a href="javascript:;" data-toggle="switcher" class="btn-switcher" data-input-id="c-switch" data-yes="1" data-no="0" >
                                    <i class="fa fa-toggle-on text-success fa-2x fa-flip-horizontal text-gray"></i>
                                </a>
                            </span>
                        </span>
                </th>
                <th>单位</th><th>物料编码</th>
            </tr>
            <tr>
                <td><div class="btn"><span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span></div></td>
                <td class="goods_code_boxs">
                    <div class="goods_code_box">
                        <input type="hidden" name="row[goods_code][]" class="goods_code">
                        <span class="goods_code_span"><img src="__CDN__/assets/addons/kuerp/img/more.png"></span>
                        <input type="text" class="ipt goods_name">
                    </div>
                </td>
                <td><div><input type="text" class="unit" readonly><input type="hidden" class="unit_id" name="row[unit_id][]"></div></td>
                <td><div><input type="text" name="row[customer_code][]"></div></td>
            </tr>
            <tr>
                <td><div class="btn"><span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span></div></td>
                <td class="goods_code_boxs">
                    <div class="goods_code_box">
                        <input type="hidden" name="row[goods_code][]" class="goods_code">
                        <span class="goods_code_span"><img src="__CDN__/assets/addons/kuerp/img/more.png"></span>
                        <input type="text" class="ipt goods_name">
                    </div>
                </td>
                <td><div><input type="text" class="unit" readonly><input type="hidden" class="unit_id" name="row[unit_id][]"></div></td>
                <td><div><input type="text" name="row[customer_code][]"></div></td>
            </tr>
            <tr>
                <td><div class="btn"><span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span></div></td>
                <td class="goods_code_boxs">
                    <div class="goods_code_box">
                        <input type="hidden" name="row[goods_code][]" class="goods_code">
                        <span class="goods_code_span"><img src="__CDN__/assets/addons/kuerp/img/more.png"></span>
                        <input type="text" class="ipt goods_name">
                    </div>
                </td>
                <td><div><input type="text" class="unit" readonly><input type="hidden" class="unit_id" name="row[unit_id][]"></div></td>
                <td><div><input type="text" name="row[customer_code][]"></div></td>
            </tr>
        </table>
    </div>
    <div class="chose_goods_boxs"></div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
