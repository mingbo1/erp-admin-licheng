{include file="kuerp/common/menu" /}
<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Batch_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-batch_id" data-rule="required" data-source="batch/index" class="form-control selectpage" name="row[batch_id]" type="text" value="" placeholder="{:__('Batch_id')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Goods_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-goods_id" data-rule="required" data-source="goods/index" class="form-control selectpage" name="row[goods_id]" type="text" value="" placeholder="{:__('Goods_id')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Goods_code')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-goods_code" class="form-control" name="row[goods_code]" type="text" placeholder="{:__('Goods_code')}">
        </div>
    </div>
    <div class="form-group goods_attr_sd">
        <label class="control-label col-xs-12 col-sm-2">{:__('Attribute_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-attribute_id" data-rule="required" data-source="attribute/index" class="form-control selectpage" name="row[attribute_id]" type="text" value="" placeholder="{:__('Attribute_id')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Goods_unit')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-goods_unit" class="form-control" name="row[goods_unit]" type="number" placeholder="{:__('Goods_unit')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Stores_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-stores_id" data-rule="required" data-source="stores/index" class="form-control selectpage" name="row[stores_id]" type="text" value="" placeholder="{:__('Stores_id')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Stock')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-stock" data-rule="required" class="form-control" step="0.0001" name="row[stock]" type="number" value="0.0000" placeholder="{:__('Stock')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="1"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Number')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-number" class="form-control" step="0.0001" name="row[number]" type="number" value="0.0000" placeholder="{:__('Number')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Batch_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-batch_name" class="form-control" name="row[batch_name]" type="text" placeholder="{:__('Batch_name')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Manufacture')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-manufacture" class="form-control" name="row[manufacture]" type="number" placeholder="{:__('Manufacture')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Guarantee')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-guarantee" class="form-control" name="row[guarantee]" type="number" placeholder="{:__('Guarantee')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Validity')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-validity" class="form-control" name="row[validity]" type="number" placeholder="{:__('Validity')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Purchase_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-purchase_id" data-rule="required" data-source="purchase/index" class="form-control selectpage" name="row[purchase_id]" type="text" value="" placeholder="{:__('Purchase_id')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Purchase_info_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-purchase_info_id" data-rule="required" data-source="purchase/info/index" class="form-control selectpage" name="row[purchase_info_id]" type="text" value="" placeholder="{:__('Purchase_info_id')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Type')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-type" class="form-control selectpicker" name="row[type]">
                {foreach name="typeList" item="vo"}
                    <option value="{$key}" {in name="key" value="0"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
