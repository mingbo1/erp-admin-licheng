{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan btn-refresh" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                           <button class="layui-btn layui-icon-btn layui-btn-sm {if condition="$auth->check($nowmenu.'/add')!=1"}hiddens{/if}" lay-event="add"><i class="layui-icon">&#xe654;</i> {:__('Add')}</button>
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-btn-danger {if condition="$auth->check($nowmenu.'/del')!=1"}hiddens{/if}" lay-event="delAll"><i class="layui-icon">&#xe640;</i> {:__('Delete')}</button>
                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        
                        <div class="layui-input-inline">
                            <input type="text" name="account_coding" id="account_coding" autocomplete="off" placeholder="{:__('Account_coding')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="account_name" id="account_name" autocomplete="off" placeholder="{:__('Account_name')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="start_account_time" id="start_account_time" autocomplete="off" placeholder="{:__('Start_account_time')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="account_type_id" id="account_type_id" placeholder="{:__('Account_type_id')}" class="layui-input">
                                <option value="">请选择{:__('Account_type_id')}</option>
                                <option value="1">{:__('Account_type_id 1')}</option>
                                <option value="2">{:__('Account_type_id 2')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="is_default" id="is_default" placeholder="{:__('Is_default')}" class="layui-input">
                                <option value="">请选择{:__('Is_default')}</option>
                                <option value="0">{:__('Is_default 0')}</option>
                                <option value="1">{:__('Is_default 1')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm" type="button" id="search" data-type="reload">
                                 <i class="layui-icon"></i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%" lay-filter="table">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
