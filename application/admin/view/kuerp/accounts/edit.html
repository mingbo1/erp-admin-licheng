{include file="kuerp/common/menu" /}
<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Account_coding')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-account_coding" data-rule="required" class="form-control" name="row[account_coding]" type="text" value="{$row.account_coding|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Account_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-account_name" data-rule="required" class="form-control" name="row[account_name]" type="text" value="{$row.account_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Balance')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-balance" data-rule="required" class="form-control" name="row[balance]" type="number" value="{$row.balance|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Start_account_balance')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-start_account_balance" data-rule="required" class="form-control" name="row[start_account_balance]" type="number" value="{$row.start_account_balance|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Start_account_time')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-start_account_time" data-rule="required" class="form-control " data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[start_account_time]" type="text" value="{:$row.start_account_time?datetime($row.start_account_time):''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Account_type_id')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-account_type_id" data-rule="required" class="form-control selectpicker" name="row[account_type_id]">
                {foreach name="accountTypeIdList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.account_type_id"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Is_default')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-is_default" class="form-control selectpicker" name="row[is_default]">
                {foreach name="isDefaultList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.is_default"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
