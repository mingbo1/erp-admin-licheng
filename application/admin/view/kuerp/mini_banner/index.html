{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh')}
                        <a href="javascript:;" class="btn btn-primary btn-add {if condition="$auth->check('kuerp/MiniBanner/add')!=1"}hidden{/if}" data-url="kuerp/MiniBanner/add"><i class="fa fa-plus"></i> {:__('Add')}</a>
                        <a href="javascript:;" class="btn btn-danger btn-del {if condition="$auth->check('kuerp/MiniBanner/del')!=1"}hidden{/if}" data-url="kuerp/MiniBanner/del"><i class="fa fa-trash"></i> {:__('Delete')}</a>
                    </div>

                    <form class="form-horizontal" id="search-form">
                        <div class="form-group">
                            <div class="col-sm-2 col-xs-6">
                                <input type="text" name="title" id="title" placeholder="{:__('Title')}" class="form-control">
                            </div>
                            <div class="col-sm-2 col-xs-6">
                                <select name="status" id="status" class="form-control">
                                    <option value="">{:__('全部状态')}</option>
                                    <option value="normal">{:__('启用')}</option>
                                    <option value="hidden">{:__('禁用')}</option>
                                </select>
                            </div>
                            <div class="col-sm-1 col-xs-6">
                                <button class="btn btn-primary" type="button" id="search"><i class="fa fa-search"></i> {:__('Search')}</button>
                            </div>
                        </div>
                    </form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('kuerp/MiniBanner/edit')}"
                           data-operate-del="{:$auth->check('kuerp/MiniBanner/del')}"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
