{include file="kuerp/common/menu" /}
<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="row">
        <div class="col-xs-12 col-sm-4 col-md-4 col-lg-4">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4 top7">{:__('Purchase_code')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-purchase_code" class="form-control" data-rule="required" value="{$code|default=''}" name="row[purchase_code]" type="text" placeholder="{:__('Purchase_code')}">
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-4 col-md-4 col-lg-4">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4 top7">{:__('Suppliers_id')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <select name="row[suppliers_id]" id="suppliers_id" class="form-control">
                        <option value="">请选择{:__('Suppliers_id')}</option>
                        {foreach name="suppliers" item="vo"}
                        <option value="{$vo.id}" {if condition="isset($row['suppliers_id']) && $vo.id==$row.suppliers_id"}selected{/if}>{$vo.supplyer_name}</option>
                        {/foreach}
                    </select>
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-4 col-md-4 col-lg-4">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4 top7">{:__('Purchase_time')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-purchase_time" class="form-control datetime" name="row[purchase_time]" type="text" value="{:date('Y-m-d')}" placeholder="{:__('Purchase_time')}">
                </div>
            </div>
        </div>
    </div>

    <div class="table_box">
        <div class="list">
            <table id="account_table">
                <tr>
                    <th></th><th>支出类别</th><th>金额</th><th>备注</th>
                </tr>
                <tr style="display: none;">
                    <td><div class="btn"><span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span></div></td>
                    <td>
                        <input type="hidden" name="row[cost_id][]" value="">
                        <select name="row[expend_type_id][]" class="form-control accounts_id">
                            <option value=""></option>
                            {foreach name="incomeType" item="vo"}
                            <option value="{$vo.id}">{$vo.name}</option>
                            {/foreach}
                        </select>
                    </td>
                    <td><input type="number" name="row[money][]" class="account_money number_decimal"></td>
                    <td><input type="text" name="row[remark][]" class="remark"></td>
                </tr>
                {foreach name="list" item="vos"}
                <tr>
                    <td><div class="btn"><span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span></div></td>
                    <td>
                        <input type="hidden" name="row[cost_id][]" value="{$vos.id|default=''}">
                        <select name="row[expend_type_id][]" class="form-control accounts_id">
                            <option value=""></option>
                            {foreach name="incomeType" item="vo"}
                            <option value="{$vo.id}" {if condition="$vo.id==$vos.expend_type_id"}selected{/if}>{$vo.name}</option>
                            {/foreach}
                        </select>
                    </td>
                    <td><input type="number" name="row[money][]" value="{$vos.money|default=''}" class="account_money number_decimal"></td>
                    <td><input type="text" name="row[remark][]" value="{$vos.remark|default=''}" class="remark"></td>
                </tr>
                {/foreach}
                {php}for($a=1;$a<=(4-sizeof($list));$a++){{/php}
                <tr>
                    <td><div class="btn"><span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span></div></td>
                    <td>
                        <input type="hidden" name="row[cost_id][]" value="">
                        <select name="row[expend_type_id][]" class="form-control accounts_id">
                            <option value=""></option>
                            {foreach name="incomeType" item="vo"}
                            <option value="{$vo.id}">{$vo.name}</option>
                            {/foreach}
                        </select>
                    </td>
                    <td><input type="number" name="row[money][]" class="account_money number_decimal"></td>
                    <td><input type="text" name="row[remark][]" class="remark"></td>
                </tr>
                {php}}{/php}
                <tr>
                    <td></td>
                    <td><div>合计</div></td>
                    <td><div><input type="text" readonly class="money_hj" value="{$money|default=''}"></div></td>
                    <td></td>
                </tr>
            </table>
        </div>
    </div>

    <div class="row" style="margin-bottom: 10px;">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <textarea id="c-note" class="form-control" rows="4" name="row[note]" cols="30" placeholder="备注信息">{$row.note|default=''}</textarea>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-12 col-sm-4 col-md-4 col-lg-4">
            <label class="control-label col-xs-12 col-sm-4 top7">结算账户:</label>
            <div class="col-xs-12 col-sm-8">
                <select name="row[accounts_id]" id="accounts_id" class="form-control">
                    <option value="">请选择结算账户</option>
                    {foreach name="accountsList" item="vo"}
                    <option value="{$vo.id}" {if condition="isset($row['account']) && $vo.id==$row.account"}selected{/if}>{$vo.account_coding} {$vo.account_name}</option>
                    {/foreach}
                </select>
                <input type="hidden" value="{$accountsDefault|default=''}" id="accountsDefault">
            </div>
        </div>
        <div class="col-xs-12 col-sm-4 col-md-4 col-lg-4">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4 top7">付款金额:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-pay_money" class="form-control price_decimal" step="0.01" name="row[pay_money]" type="number" value="{$money|default=''}" placeholder="付款金额">
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-4 col-md-4 col-lg-4">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4 top7">本次欠款:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-arrears" class="form-control price_decimal" step="0.01" name="row[arrears]" type="number" value="" readonly placeholder="本次欠款">
                </div>
            </div>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
