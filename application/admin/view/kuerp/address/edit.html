{include file="kuerp/common/menu" /}
<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Nickname')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-nickname" class="form-control" name="row[nickname]" type="text" value="{$row.nickname|htmlentities}" placeholder="{:__('Nickname')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Connect_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-connect_name" data-rule="required" class="form-control" name="row[connect_name]" type="text" value="{$row.connect_name|htmlentities}" placeholder="{:__('Connect_name')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Connect_phone')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-connect_phone" data-rule="required" class="form-control" name="row[connect_phone]" type="text" value="{$row.connect_phone|htmlentities}" placeholder="{:__('Connect_phone')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Connect_mobile')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-connect_mobile" data-rule="required" class="form-control" name="row[connect_mobile]" type="text" value="{$row.connect_mobile|htmlentities}" placeholder="{:__('Connect_mobile')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Area_province_id')}{:__('Area_city_id')}{:__('Area_town_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="form-inline" data-toggle="cxselect" data-selects="province,city,area">
                <select class="province form-control" name="row[province]" data-url="kuerp/address/area" data-value="{$row.province|htmlentities}"></select>
                <select class="city form-control" name="row[city]" data-url="kuerp/address/area" data-value="{$row.city|htmlentities}"></select>
                <select class="area form-control" name="row[area]" data-url="kuerp/address/area" data-value="{$row.area|htmlentities}"></select>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Detail_address')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-detail_address" data-rule="required" class="form-control" name="row[detail_address]" type="text" value="{$row.detail_address|htmlentities}" placeholder="{:__('Detail_address')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Post_code')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-post_code" data-rule="required" class="form-control" name="row[post_code]" type="text" value="{$row.post_code|htmlentities}" placeholder="{:__('Post_code')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Is_default')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-is_default" data-rule="required" class="form-control selectpicker" name="row[is_default]">
                {foreach name="isDefaultList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.is_default"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
