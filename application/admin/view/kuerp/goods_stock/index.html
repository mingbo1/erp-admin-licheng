{include file="kuerp/common/menu" /}
<style>
    .stock-total-bar {margin-bottom: 10px;padding: 8px 12px;background: #f7f8fa;border: 1px solid #e6e6e6;border-radius: 3px;line-height: 26px;font-size: 13px;color: #555;}
    .stock-total-bar .stock-total-item {margin-right: 20px;white-space: nowrap;}
    .stock-total-bar .stock-total-item b {color: #009688;font-weight: 600;}
    .stock-total-bar .stock-total-store {margin-right: 20px;white-space: nowrap;color: #666;}
</style>
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        <div class="layui-input-inline" style="min-width: 182px;">
                            <div id="stores" class="xm-select-demo"></div>
                        </div>
                        <div class="layui-input-inline" style="min-width: 182px;">
                            <div id="goods" class="xm-select-demo"></div>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm btn-refresh" type="button" id="search" data-type="reload">
                                 <i class="layui-icon"></i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <!-- 顶部合计统计：由 GoodsStock::total() 单独计算，只在页面加载/刷新/搜索时更新，翻页不重算 -->
                    <!-- 价格相关统计（成本合计/平均单位成本）已去掉，只保留数量 -->
                    <div id="stock_total_bar" class="stock-total-bar">
                        <span class="stock-total-item">商品品种：<b id="total_goods">—</b></span>
                        <span class="stock-total-item">库存总量：<b id="total_stock">—</b></span>
                        <span id="total_stores"></span>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('goods_stock/edit')}" 
                           data-operate-del="{:$auth->check('goods_stock/del')}" 
                           width="100%" lay-filter="table">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
