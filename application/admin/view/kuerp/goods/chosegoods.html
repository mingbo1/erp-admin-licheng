{include file="kuerp/common/menu" /}
<style>
    /* 选择商品弹窗：商品名称过长时换行完整展示 */
    .chosegoods .layui-table-cell{height:auto;min-height:28px;line-height:20px;white-space:normal;word-break:break-all;padding:4px 10px;}
    .chosegoods .layui-table-header .layui-table-cell{height:28px;line-height:20px;}
</style>
<div class="panel panel-default panel-intro chosegoods">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <form class="layui-form layui-search" id="layui-search">
                        <div class="layui-input-inline">
                            <input type="text" name="keyword" id="keyword" placeholder="{:__('请输入商品编号或名称')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="product_type" id="product_types" placeholder="{:__('Product_type')}" class="layui-input">
                                <option value="">{:__('Product_type')}</option>
                                <option value="finished">{:__('Product_type finished')}</option>
                                <option value="semi_finished">{:__('Product_type semi_finished')}</option>
                                <option value="part">{:__('Product_type part')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="location_id" id="location_ids" placeholder="{:__('Location_id')}" class="layui-input">
                                <option value="">{:__('Location_id')}</option>
                                {foreach name="goods_location" item="vo"}
                                <option value="{$vo.id}">{$vo.location_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm" type="button" id="search" data-type="reload">
                                 <i class="layui-icon"></i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <div class="row">
                        <div class="col-xs-9 col-sm-9 col-md-9 col-lg-9">
                            <table id="choseTable" class="table table-striped table-bordered table-hover table-nowrap"
                                   width="100%" lay-filter="table">
                            </table>
                        </div>
                        <div class="col-xs-3 col-sm-3 col-md-3 col-lg-3">
                            <div class="form-group">
                                <label class="control-label col-xs-12 col-sm-12">{:__('分类')}:</label>
                            </div>
                            <div class="form-group">
                                <div class="col-xs-12 col-sm-12">
                                    <div id="treeview"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <script type="text/html" id="btnToolbar">
                    <div class="layui-btn-container" style="text-align: right">
                        <button type="button" id="sure" class="btn btn-success btn-embossed" lay-event="sure">确定</button>
                        <button type="button" id="cancel" class="btn btn-default btn-embossed">取消</button>
                    </div>
                </script>
            </div>
        </div>
    </div>
</div>
