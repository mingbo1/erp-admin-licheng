{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan btn-refresh" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                           <button class="layui-btn layui-icon-btn layui-btn-sm {if condition="$auth->check($nowmenu.'/add')!=1"}hiddens{/if}" lay-event="add"><i class="layui-icon">&#xe654;</i> {:__('Add')}</button>
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-blue {if condition="$auth->check($nowmenu.'/import')!=1"}hiddens{/if}" lay-event="import"><i class="layui-icon">&#xe681;</i> {:__('Import')}</button>
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-btn-danger {if condition="$auth->check($nowmenu.'/del')!=1"}hiddens{/if}" lay-event="delAll"><i class="layui-icon">&#xe640;</i> {:__('Delete')}</button>
                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        
                        <div class="layui-input-inline">
                            <input type="text" name="goods_code" id="goods_code" autocomplete="off" placeholder="{:__('Goods_code')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="goods_name" id="goods_name" autocomplete="off" placeholder="{:__('Goods_name')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="goods_specification_id" id="goods_specification_id" autocomplete="off" placeholder="{:__('Goods_specification_id')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="packaging" id="packaging" autocomplete="off" placeholder="规格3/封装" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="vendor_name" id="vendor_name" autocomplete="off" placeholder="规格2/厂商" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="status" id="status" placeholder="{:__('Status')}" class="layui-input">
                                <option value="">请选择{:__('Status')}</option>
                                <option value="0">{:__('Status 0')}</option>
                                <option value="1">{:__('Status 1')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="is_show" id="is_show" placeholder="{:__('Is_show')}" class="layui-input">
                                <option value="">请选择{:__('Is_show')}</option>
                                <option value="0">{:__('Is_show 0')}</option>
                                <option value="1">{:__('Is_show 1')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="product_type" id="product_type" placeholder="{:__('Product_type')}" class="layui-input">
                                <option value="">请选择{:__('Product_type')}</option>
                                <option value="finished">{:__('Product_type finished')}</option>
                                <option value="semi_finished">{:__('Product_type semi_finished')}</option>
                                <option value="part">{:__('Product_type part')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="location_id" id="location_id" placeholder="{:__('Location_id')}" class="layui-input">
                                <option value="">请选择{:__('Location_id')}</option>
                                {foreach name="locationlist" item="vo" key="k"}
                                {if $k neq ''}
                                <option value="{$k}">{$vo}</option>
                                {/if}
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="supplier_id" id="supplier_id" placeholder="供应商" class="layui-input">
                                <option value="">请选择供应商</option>
                                {foreach name="supplierlist" item="vo"}
                                <option value="{$vo.id}">{$vo.supplyer_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm" type="button" id="search" data-type="reload">
                                 <i class="layui-icon"></i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%" lay-filter="table">
                    </table>
                    <style>
                        /* 商品名称列：自动换行完整展示商品名 */
                        .layui-table-view[lay-filter="table"] td[data-field="goods_name"] .layui-table-cell {
                            height: auto;
                            min-height: 38px;
                            padding-top: 8px;
                            padding-bottom: 8px;
                            line-height: 22px;
                            white-space: normal;
                            word-break: break-all;
                            text-overflow: clip;
                        }
                    </style>
                </div>
            </div>

        </div>
    </div>
</div>
