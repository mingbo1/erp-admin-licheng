{include file="kuerp/common/menu" /}
<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="row">
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4"><span class="must">*</span>{:__('Supplyer_code')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-supplyer_code" data-rule="required" class="form-control" name="row[supplyer_code]" type="text" value="{$code|default=''}" placeholder="{:__('Supplyer_code')}">
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4"><span class="must">*</span>{:__('Supplyer_name')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-supplyer_name" data-rule="required" class="form-control" name="row[supplyer_name]" type="text" placeholder="{:__('Supplyer_name')}">
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Supplyertype_id')}:</label>
                <div class="col-xs-12 col-sm-8">
                    {:build_select('row[supplyertype_id]', $supplyertype, null, ['class'=>'form-control selectpicker', 'data-rule'=>'required','id'=>'c-supplyertype_id'])}
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Account_time')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-account_time" class="form-control datetimepicker" data-date-format=" YYYY-MM-DD" data-use-current="true" name="row[account_time]" type="text" placeholder="{:__('Account_time')}">
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Opening_payable')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-opening_payable" class="form-control" step="0.01" name="row[opening_payable]" type="number" value="" placeholder="{:__('Opening_payable')}">
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Opening_prepayment')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-opening_prepayment" class="form-control" step="0.01" name="row[opening_prepayment]" type="number" value="" placeholder="{:__('Opening_prepayment')}">
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Vat_rate')}%:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-vat_rate" class="form-control" step="0.001" name="row[vat_rate]" type="number" value="" placeholder="{:__('Vat_rate')}">
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Identification')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-identification" class="form-control" name="row[identification]" type="text" placeholder="{:__('Identification')}">
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Deposit_bank')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-deposit_bank" class="form-control" name="row[deposit_bank]" type="text" placeholder="{:__('Deposit_bank')}">
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-6 col-md-6 col-lg-6">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Bank_number')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-bank_number" class="form-control" name="row[bank_number]" type="text" placeholder="{:__('Bank_number')}">
                </div>
            </div>
        </div>
    </div>

    <div class="list">
        <table>
            <tr>
                <th></th><th><span class="must">*</span>联系人</th><th>手机</th><th>座机</th><th>QQ/微信/Email</th><th>联系地址</th><th>首要联系人</th>
            </tr>
            <tr>
                <td><div class="btn"><span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span></div></td>
                <td><div><input type="text" name="user[name][]"><input type="hidden" name="user[id][]" value=""></div></td>
                <td><div><input type="text" name="user[mobile][]"></div></td>
                <td><div><input type="text" name="user[phone][]"></div></td>
                <td><div><input type="text" name="user[qqnum][]"></div></td>
                <td><div><input type="text" name="user[address][]"></div></td>
                <td><div><select name="user[first][]"><option value="0">否</option><option value="1">是</option></select></div></td>
            </tr>
            <tr>
                <td><div class="btn"><span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span></div></td>
                <td><div><input type="text" name="user[name][]"><input type="hidden" name="user[id][]" value=""></div></td>
                <td><div><input type="text" name="user[mobile][]"></div></td>
                <td><div><input type="text" name="user[phone][]"></div></td>
                <td><div><input type="text" name="user[qqnum][]"></div></td>
                <td><div><input type="text" name="user[address][]"></div></td>
                <td><div><select name="user[first][]"><option value="0">否</option><option value="1">是</option></select></div></td>
            </tr>
            <tr>
                <td><div class="btn"><span class="add"><i class="fa fa-plus"></i></span><span class="del"><i class="fa fa-trash"></i></span></div></td>
                <td><div><input type="text" name="user[name][]"><input type="hidden" name="user[id][]" value=""></div></td>
                <td><div><input type="text" name="user[mobile][]"></div></td>
                <td><div><input type="text" name="user[phone][]"></div></td>
                <td><div><input type="text" name="user[qqnum][]"></div></td>
                <td><div><input type="text" name="user[address][]"></div></td>
                <td><div><select name="user[first][]"><option value="0">否</option><option value="1">是</option></select></div></td>
            </tr>
        </table>
    </div>

    <div class="row">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <textarea id="c-note" class="form-control" rows="5" name="row[note]" cols="30" placeholder="添加备注信息，不超过100个字"></textarea>
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
