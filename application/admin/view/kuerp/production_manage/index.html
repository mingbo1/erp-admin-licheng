{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan btn-refresh" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-green {if condition="$auth->check($nowmenu.'/export')!=1"}hiddens{/if}" lay-event="export"><i class="layui-icon">&#xe682;</i> 导出</button>
                        </div>
                    </script>

                    <script type="text/html" id="barDemoProdManage">
                        <a class="layui-btn layui-btn-xs {if condition="$auth->check($nowmenu.'/detail')!=1"}hiddens{/if}" lay-event="detail">查看详情</a>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        <div class="layui-input-inline">
                            <input type="text" name="purchase_code" id="purchase_code" autocomplete="off" placeholder="{:__('Purchase_code')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="purchase_time" id="purchase_time" autocomplete="off" placeholder="{:__('Purchase_time')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="production_date" id="production_date" autocomplete="off" placeholder="{:__('Production_date')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="customers_id" id="customers_id" placeholder="{:__('Customers_id')}" class="layui-input">
                                <option value="">请选择{:__('Customers_id')}</option>
                                {foreach name="customersList" item="vo"}
                                <option value="{$vo.id}">{$vo.customer_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="preparation_id" id="preparation_id" placeholder="{:__('Preparation_id')}" class="layui-input">
                                <option value="">请选择{:__('Preparation_id')}</option>
                                {foreach name="adminList" item="vo"}
                                <option value="{$vo.id}">{$vo.username}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline">
                            <select name="check_status" id="check_status" placeholder="{:__('Check_status')}" class="layui-input">
                                <option value="">请选择{:__('Check_status')}</option>
                                <option value="0">{:__('Check_status 0')}</option>
                                <option value="1">{:__('Check_status 1')}</option>
                            </select>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm" type="button" id="search" data-type="reload">
                                 <i class="layui-icon"></i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%" lay-filter="table">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
