{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="toolbar">
                        <div class="layui-btn-container">
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan btn-refresh" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                            <button class="layui-btn layui-btn-sm layui-btn-success btn-add" lay-event="add"><i class="layui-icon">&#xe654;</i> {:__('Add')}</button>
                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        <div class="layui-input-inline">
                            <input type="text" name="nickname" id="nickname" autocomplete="off" placeholder="{:__('Nickname')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="mobile" id="mobile" autocomplete="off" placeholder="{:__('Mobile')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="user_type" id="user_type" placeholder="{:__('User_type')}" class="layui-input">
                                <option value="">{:__('User_type')}</option>
                                {foreach name="userTypeList" item="vo" key="k"}
                                <option value="{$k}">{$vo}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline" style="width: 90px">
                            <button class="layui-btn layui-btn-sm btn-refresh" type="button" id="search" data-type="reload">
                                 <i class="layui-icon">&#xe615;</i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%" lay-filter="table">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
