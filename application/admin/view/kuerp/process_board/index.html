{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan btn-refresh" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-blue {if condition="$auth->check($nowmenu.'/add')!=1"}hiddens{/if}" lay-event="add"><i class="layui-icon">&#xe654;</i> {:__('Add')}</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-red fright {if condition="$auth->check($nowmenu.'/del')!=1"}hiddens{/if}" lay-event="delAll"><i class="layui-icon">&#xe640;</i> {:__('Del')}</button>
                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        <div class="layui-input-inline">
                            <input type="text" name="board_date" id="board_date" autocomplete="off" placeholder="{:__('Board_date')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="note" id="note" autocomplete="off" placeholder="{:__('Note')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm" type="button" id="search" data-type="reload">
                                <i class="layui-icon"></i> {:__('Search')}
                            </button>
                        </div>
                    </form>
                    <script type="text/html" id="barDemoBoard">
                        <a class="layui-btn layui-btn-xs layui-bg-cyan {if condition="$auth->check($nowmenu.'/chart')!=1"}hiddens{/if}" lay-event="chart">{:__('Board_chart')}</a>
                        <a class="layui-btn layui-btn-xs {if condition="$auth->check($nowmenu.'/edit')!=1"}hiddens{/if}" lay-event="edit">编辑</a>
                        <a class="layui-btn layui-btn-xs layui-bg-red {if condition="$auth->check($nowmenu.'/del')!=1"}hiddens{/if}" lay-event="del">删除</a>
                    </script>

                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           width="100%" lay-filter="table">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
