{include file="kuerp/common/menu" /}
<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

        <div class="col-xs-12 col-sm-3 col-md-3 col-lg-3">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Business_type')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <select  id="c-business_type" data-rule="required" class="form-control selectpicker" name="row[business_type]">
                        {foreach name="businessTypeList" item="vo"}
                        <option value="{$key}">{$vo}</option>
                        {/foreach}
                    </select>
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-3 col-md-3 col-lg-3">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Purchase_code')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <input id="c-purchase_code" class="form-control" data-rule="required" value="{$code|default=''}" name="row[purchase_code]" type="text" placeholder="{:__('Purchase_code')}">
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-3 col-md-3 col-lg-3 chose_customers_id chose_u">
            <div class="form-group">
                <label class="control-label col-xs-12 col-sm-4">{:__('Customers_id')}:</label>
                <div class="col-xs-12 col-sm-8">
                    <select name="row[customers_id]" id="customers_id" class="form-control">
                        <option value="">请选择{:__('Customers_id')}</option>
                        {foreach name="customers" item="vo"}
                        <option value="{$vo.id}" {if condition="isset($row['customers_id']) && $vo.id==$row.customers_id"}selected{/if}>{$vo.customer_name}</option>
                        {/foreach}
                    </select>
                </div>
            </div>
        </div>
        <div class="col-xs-12 col-sm-3 col-md-3 col-lg-3 chose_customers_out_id chose_u hiddens">
