{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm" lay-event="add" style="padding-left: 10px">{:__('确定')}</button>
                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        <div class="layui-input-inline">
                            <input type="text" name="bill_time" id="bill_time" autocomplete="off" placeholder="{:__('Bill_time')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="bill_codes" id="bill_codes" autocomplete="off" placeholder="{:__('单据编号，多个请用,隔开')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="suppliers_code" id="suppliers_code" placeholder="{:__('供应商')}" class="layui-input">
                                <option value="">请选择{:__('供应商')}</option>
                                {foreach name="suppliersList" item="vo"}
                                <option value="{$vo.supplyer_code}">{$vo.supplyer_code} {$vo.supplyer_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm" type="button" id="search" data-type="reload">
                                <i class="layui-icon"></i> {:__('Search')}
                            </button>
                        </div>
                    </form>
                    <table id="invoicingTable" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('invoicing/edit')}"
                           data-operate-del="{:$auth->check('invoicing/del')}"
                           width="100%" lay-filter="table">
                    </table>
                    <div class="row invoicing">
                        <div class="col-xs-12 col-sm-3 col-md-3 col-lg-3">
                            <div class="form-group">
                                <label class="control-label col-xs-12 col-sm-4">{:__('开票日期')}:</label>
                                <div class="col-xs-12 col-sm-8">
                                    <input id="c-purchase_time" class="form-control datetime" data-rule="required" data-use-current="true" name="row[purchase_time]" type="text" value="{:date('Y-m-d')}" placeholder="{:__('开票日期')}">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12 col-sm-3 col-md-3 col-lg-3">
                            <div class="form-group">
                                <label class="control-label col-xs-12 col-sm-4">{:__('发票号')}:</label>
                                <div class="col-xs-12 col-sm-8">
                                    <input id="c-invoice" class="form-control" data-rule="required" value="" name="row[invoice]" type="text" placeholder="{:__('发票号')}">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-12 col-sm-3 col-md-3 col-lg-3">
                            <div class="form-group">
                                <label class="control-label col-xs-12 col-sm-4">{:__('发票抬头')}:</label>
                                <div class="col-xs-12 col-sm-8">
                                    <input id="c-invoice_header" class="form-control" data-rule="required" value="" name="row[invoice_header]" type="text" placeholder="{:__('发票抬头')}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
