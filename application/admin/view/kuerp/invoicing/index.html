{include file="kuerp/common/menu" /}
<div class="panel panel-default panel-intro">
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">

                    <script type="text/html" id="thisToolbar">
                        <div class="layui-btn-container">
                           <button class="layui-btn layui-icon-btn layui-btn-sm layui-bg-cyan" lay-event="refresh"><i class="layui-icon">&#xe669;</i> {:__('Refresh')}</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm layui-btn-danger {if condition="$auth->check($nowmenu.'/del')!=1"}hiddens{/if}" lay-event="delAll"><i class="layui-icon">&#xe640;</i> {:__('Delete')}</button>
                            <button class="layui-btn layui-icon-btn layui-btn-sm {if condition="$auth->check($nowmenu.'/add')!=1"}hiddens{/if}" lay-event="add"><i class="layui-icon">&#xe654;</i> {:__('开票')}</button>
                        </div>
                    </script>

                    <form class="layui-form layui-search" id="layui-search">
                        <div class="layui-input-inline">
                            <input type="text" name="bill_time" id="bill_time" autocomplete="off" placeholder="{:__('Bill_time')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <input type="text" name="bill_codes" id="bill_codes" autocomplete="off" placeholder="{:__('单据编号，多个请用,隔开')}" class="layui-input">
                        </div>
                        <div class="layui-input-inline">
                            <select name="suppliers_code" id="suppliers_code" placeholder="{:__('供应商')}" class="layui-input">
                                <option value="">请选择{:__('供应商')}</option>
                                {foreach name="suppliersList" item="vo"}
                                <option value="{$vo.supplyer_code}">{$vo.supplyer_code} {$vo.supplyer_name}</option>
                                {/foreach}
                            </select>
                        </div>
                        <div class="layui-input-inline " style="width: 90px">
                            <button class="layui-btn layui-btn-sm btn-refresh" type="button" id="search" data-type="reload">
                                 <i class="layui-icon"></i> {:__('Search')}
                            </button>
                         </div>
                    </form>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('invoicing/edit')}" 
                           data-operate-del="{:$auth->check('invoicing/del')}" 
                           width="100%" lay-filter="table">
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
