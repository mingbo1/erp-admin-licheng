{include file="kuerp/common/menu" /}
<form id="recon-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action=""
      data-recon-id="0" data-supplier="">

    <div class="panel panel-default">
        <div class="panel-heading"><b>对账单信息</b></div>
        <div class="panel-body">
            <div class="row">
                <div class="col-xs-12 col-sm-4">
                    <div class="form-group">
                        <label class="control-label col-xs-12 col-sm-4"><span class="must">*</span> 供应商:</label>
                        <div class="col-xs-12 col-sm-8">
                            <select id="c-supplyer_code" name="row[supplyer_code]" class="form-control selectpicker" data-rule="required">
                                <option value="">请选择供应商</option>
                                {foreach name="suppliers" item="vo"}
                                <option value="{$vo.supplyer_code}">{$vo.supplyer_code} {$vo.supplyer_name}</option>
                                {/foreach}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-4">
                    <div class="form-group">
                        <label class="control-label col-xs-12 col-sm-4">对账期间:</label>
                        <div class="col-xs-12 col-sm-8">
                            <div class="input-group">
                                <input type="date" id="c-period_start" name="row[period_start]" class="form-control" value="{$periodStart}">
                                <span class="input-group-addon">至</span>
                                <input type="date" id="c-period_end" name="row[period_end]" class="form-control" value="{$periodEnd}">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-xs-12 col-sm-4">
                    <div class="form-group">
                        <label class="control-label col-xs-12 col-sm-4">备注:</label>
                        <div class="col-xs-12 col-sm-8">
                            <input type="text" name="row[remark]" class="form-control" placeholder="备注">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="panel panel-default">
        <div class="panel-heading">
            <b>可对账单据</b>
            <span style="color:#999;font-size:12px;">（已审核、未对账的采购单与购货退货单；退货单按负数冲减，金额为净额）</span>
            <button type="button" class="btn btn-default btn-sm" id="btn-load-purchase" style="float:right;margin-top:-4px;">
                <i class="fa fa-refresh"></i> 重新加载
            </button>
        </div>
        <div class="panel-body" style="padding:0;">
            <table class="table table-striped table-bordered table-hover" style="margin-bottom:0;">
                <thead>
                    <tr>
                        <th style="width:40px;text-align:center;"><input type="checkbox" id="check-all"></th>
                        <th style="width:100px;">单据类型</th>
                        <th>单据编号</th>
                        <th style="width:110px;">单据日期</th>
                        <th style="width:100px;text-align:right;">数量</th>
                        <th style="width:120px;text-align:right;">金额</th>
                        <th style="width:110px;text-align:right;">已付/已退</th>
                        <th style="width:100px;text-align:center;">入库状态</th>
                    </tr>
                </thead>
                <tbody id="purchase-body"></tbody>
            </table>
            <div id="purchase-empty" style="padding:14px;text-align:center;color:#999;">请选择供应商后加载采购单</div>
        </div>
        <div class="panel-footer" style="text-align:right;">
            已选 <b id="selected-count">0</b> 张单据，对账净额合计：<b id="selected-total" style="color:#ff5722;">￥0.00</b>
        </div>
    </div>

    <input type="hidden" name="purchase_ids" id="purchase_ids" value="">
    <input type="hidden" name="exchange_ids" id="exchange_ids" value="">

    <div class="form-group layer-footer" style="text-align:center;">
        <button type="submit" class="btn btn-success btn-embossed">保存草稿</button>
        <button type="button" class="btn btn-default btn-embossed layer-close">取消</button>
    </div>
</form>
