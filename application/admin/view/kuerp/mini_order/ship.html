{include file="kuerp/common/menu" /}
<form id="ship-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('订单号')}:</label>
        <div class="col-xs-12 col-sm-8" style="padding-top:7px;">
            <strong>{$order.order_no}</strong>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('配送方式')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label><input type="radio" name="delivery_type" value="logistics" checked> {:__('物流配送')}</label>
                <label><input type="radio" name="delivery_type" value="professional"> {:__('专业配送')}</label>
            </div>
        </div>
    </div>

    <div id="logistics-fields">
        <div class="form-group">
            <label class="control-label col-xs-12 col-sm-2">{:__('快递公司')}:</label>
            <div class="col-xs-12 col-sm-8">
                <input class="form-control" name="express_company" type="text" value="">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-xs-12 col-sm-2">{:__('快递编码')}:</label>
            <div class="col-xs-12 col-sm-8">
                <input class="form-control" name="express_code" type="text" value="" placeholder="yunda, shentong, shunfeng...">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-xs-12 col-sm-2">{:__('快递单号')}:</label>
            <div class="col-xs-12 col-sm-8">
                <input class="form-control" name="express_no" type="text" value="">
            </div>
        </div>
    </div>

    <div id="professional-fields" style="display:none;">
        <div class="form-group">
            <label class="control-label col-xs-12 col-sm-2">{:__('配送员')}:</label>
            <div class="col-xs-12 col-sm-8">
                <input class="form-control" name="carrier_name" type="text" value="">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-xs-12 col-sm-2">{:__('联系电话')}:</label>
            <div class="col-xs-12 col-sm-8">
                <input class="form-control" name="carrier_mobile" type="text" value="">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('备注')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea class="form-control" name="remark" rows="2"></textarea>
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('确认发货')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
<script>
$('input[name=delivery_type]').on('change', function() {
    if ($(this).val() === 'logistics') {
        $('#logistics-fields').show();
        $('#professional-fields').hide();
    } else {
        $('#logistics-fields').hide();
        $('#professional-fields').show();
    }
});
</script>
