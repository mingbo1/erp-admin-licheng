{include file="kuerp/common/menu" /}
<form id="confirm-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('订单号')}:</label>
        <div class="col-xs-12 col-sm-8" style="padding-top:7px;">
            <strong>{$order.order_no}</strong>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('应付金额')}:</label>
        <div class="col-xs-12 col-sm-8" style="padding-top:7px; color:red;">
            <strong>￥{$order.payable_amount}</strong>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('选择仓库')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select name="stores_id" class="form-control" data-rule="required">
                <option value="">{:__('请选择')}</option>
                {foreach name="storesList" item="vo"}
                <option value="{$vo.id}">{$vo.name}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('商品明细')}:</label>
        <div class="col-xs-12 col-sm-8">
            <table class="table table-bordered table-striped" style="margin-bottom:0;">
                <thead><tr><th>{:__('商品')}</th><th>{:__('数量')}</th><th>{:__('单价')}</th><th>{:__('小计')}</th></tr></thead>
                <tbody>
                {volist name="order.goods" id="vo"}
                <tr>
                    <td>{$vo.goods_name} ({$vo.goods_code})</td>
                    <td>{$vo.quantity}</td>
                    <td>￥{$vo.unit_price}</td>
                    <td>￥{$vo.all_money}</td>
                </tr>
                {/volist}
                </tbody>
            </table>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('确认')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
